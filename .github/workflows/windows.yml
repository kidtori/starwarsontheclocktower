name: Test and build Windows package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.7.0'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare embedded Laya
        shell: pwsh
        run: ./scripts/prepare-laya.ps1
      - name: Verify embedded Laya
        run: node scripts/smoke-laya.js
      - name: Build portable executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Clocktower-Studio-Windows
          path: dist/Clocktower-Studio-*-windows-x64.zip*
      - name: Publish tagged Windows release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --title "Clocktower Studio ${{ github.ref_name }}" --notes-file packaging/RELEASE-NOTES.md }
          gh release upload "${{ github.ref_name }}" dist/Clocktower-Studio-*-windows-x64.zip* --clobber
