<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clocktower Studio</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand">CLOCKTOWER <span>SCRIPT & THEME STUDIO</span></div><nav aria-label="Workspace actions"><details class="nav-menu"><summary>BOTC</summary><div class="menu-panel"><button id="new">Fresh script</button><button id="knowledge">Roles & expansions</button><button id="import-md">Import Markdown</button><button id="export-text">Export Markdown</button><button id="export">Approved report</button></div></details><details class="nav-menu"><summary>Themes</summary><div class="menu-panel"><button id="themes">Manage themes</button><button id="theme">Theme analysis</button></div></details><details class="nav-menu"><summary>Review</summary><div class="menu-panel"><button id="regenerate">Rebuild mechanics</button><button id="mechanical">Mechanical analysis</button><button id="review">Review conversation</button></div></details><div class="history-actions"><button id="undo" aria-label="Undo">↶</button><button id="redo" aria-label="Redo">↷</button></div><button id="approve" class="primary">Confirm mechanics</button></nav></header>
<div id="notice" role="status"></div><div id="projectbar"></div><main><aside id="workspace"><div id="project-editor"></div><details id="review-panel"><summary>Review conversation</summary><div id="review-slot"></div></details></aside><section id="script"></section><aside id="details"></aside><aside id="conversation"><h2>Review conversation</h2><p id="model-status" class="muted"></p><div id="messages" aria-live="polite"></div><form id="chat-form"><label for="question">Ask about the script or selected role</label><textarea id="question" rows="3"></textarea><button>Ask</button></form></aside></main>
<dialog id="modal"><div class="dialog-top"><h2 id="modal-title"></h2><button id="close-modal" aria-label="Close dialog">×</button></div><p id="modal-error" role="alert"></p><div id="modal-content"></div></dialog>
<script src="/casting.js"></script><script src="/connections.js"></script><script src="/app.js"></script></body></html>
